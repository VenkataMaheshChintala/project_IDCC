spring:
  application:
    name: codearena-judge-worker

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codearena}
    username: ${DATABASE_USERNAME:codearena}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false   # Migrations managed by backend

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 10000ms

server:
  port: 8090

judge:
  submission-stream: ${JUDGE_SUBMISSION_STREAM:codearena:submissions:stream}
  run-stream: ${JUDGE_RUN_STREAM:codearena:runs:stream}
  stream-group: ${JUDGE_STREAM_GROUP:codearena-judges}
  worker-id: ${JUDGE_WORKER_ID:}
  run-result-prefix: "codearena:run:result:"
  run-result-ttl-seconds: ${JUDGE_RUN_RESULT_TTL_SECONDS:900}
  reclaim-idle-seconds: ${JUDGE_RECLAIM_IDLE_SECONDS:60}
  cpu-limit: ${JUDGE_CPU_LIMIT:1.5}
  memory-limit-mb: ${JUDGE_MEMORY_LIMIT_MB:256}
  timeout-seconds: ${JUDGE_TIMEOUT_SECONDS:10}
  compile-timeout-ms: ${JUDGE_COMPILE_TIMEOUT_MS:10000}
  max-processes: ${JUDGE_MAX_PROCESSES:50}
  docker-image: ${JUDGE_DOCKER_IMAGE:codearena-sandbox:latest}
  submission-worker-threads: ${JUDGE_SUBMISSION_WORKER_THREADS:4}
  run-worker-threads: ${JUDGE_RUN_WORKER_THREADS:2}

logging:
  level:
    com.codearena.judge: INFO

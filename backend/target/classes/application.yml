spring:
  application:
    name: codearena-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codearena}
    username: ${DATABASE_USERNAME:codearena}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    threads:
      max: 500
      min-spare: 50

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_64_CHARS}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  judge:
    submission-stream: ${JUDGE_SUBMISSION_STREAM:codearena:submissions:stream}
    run-stream: ${JUDGE_RUN_STREAM:codearena:runs:stream}
    outbox-poll-ms: ${JUDGE_OUTBOX_POLL_MS:250}
    submission-status-poll-ms: ${JUDGE_SUBMISSION_STATUS_POLL_MS:1000}
    run-result-ttl-seconds: ${JUDGE_RUN_RESULT_TTL_SECONDS:900}
    max-source-bytes: ${JUDGE_MAX_SOURCE_BYTES:65536}
    max-input-bytes: ${JUDGE_MAX_INPUT_BYTES:65536}
    cpu-limit: ${JUDGE_CPU_LIMIT:1.5}
    memory-limit-mb: ${JUDGE_MEMORY_LIMIT_MB:256}
    timeout-seconds: ${JUDGE_TIMEOUT_SECONDS:10}
    max-processes: ${JUDGE_MAX_PROCESSES:50}
    docker-image: ${JUDGE_DOCKER_IMAGE:eclipse-temurin:21-jdk-alpine}

  rate-limit:
    submissions-per-minute: ${RATE_LIMIT_SUBMISSIONS_PER_MINUTE:5}
    login-attempts: ${RATE_LIMIT_LOGIN_ATTEMPTS:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.codearena: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
